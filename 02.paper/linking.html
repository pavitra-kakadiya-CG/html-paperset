<!DOCTYPE html>
<html>
<head>
    <title>Useful Resources</title>
</head>

<body>

    <!-- Main heading -->
    <h1>Useful Resources</h1>

    <!-- First hyperlink -->
    <p>
        <a href="https://www.google.com">
            Google
        </a>
    </p>

    <!-- Second hyperlink opens in a new tab -->
    <p>
        <a href="https://www.wikipedia.org" target="_blank">
            Wikipedia
        </a>
    </p>

    <!-- Third hyperlink -->
    <p>
        <a href="https://www.w3.org">
            W3C
        </a>
    </p>

    <!-- Embedded webpage -->
    <h2>Embedded Website</h2>

    <iframe
        src="https://www.example.com"
        width="600"
        height="300">
    </iframe>


    <h1>HTML Elements Demonstration</h1>

    <!-- Block-level elements -->
    <!-- h1 and p are block-level elements -->
    <h2>This is a block-level heading</h2>

    <p>
        This is a block-level paragraph.
    </p>

    <!-- Inline elements -->
    <!-- span, a and strong are inline elements -->
    <p>
        This is
        <span>inline text</span>.

        Visit
        <a href="#">this link</a>.

        This is
        <strong>important text</strong>.
    </p>

    <!-- Text-formatting elements -->
    <p>
        <strong>Bold/important text</strong>
    </p>

    <p>
        <em>Emphasized text</em>
    </p>

    <p>
        <mark>Highlighted text</mark>
    </p>

</body>
</html>
