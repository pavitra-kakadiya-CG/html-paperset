<!DOCTYPE html> 
<html>
     <head> 
        <title>Student Registration Form</title>
     </head> 
     <body> <!-- Main heading -->
         <h1>Student Registration Form</h1>
 <!-- Registration form -->
    <form action="#" method="post">
    <!-- Full Name -->
    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required> <br>
 <br> <!-- Email -->
 <label for="email">Email:</label>
 <input type="email" id="email" name="email" placeholder="Enter your email" required> <br><br> 
 <!-- Password --> 
 <label for="password">Password:</label> 
<input type="password" id="password" name="password" placeholder="Enter password" required> <br><br> 
  <!-- Date of Birth -->
                        
<label for="dob">Date of Birth:</label>
<input type="date" id="dob" name="dob"> <br><br> 
<!-- Gender using radio buttons -->
<label>Gender:</label> 
 <input type="radio" id="male" name="gender" value="Male">
 <label for="male">Male</label> 
 <input type="radio" id="female" name="gender" value="Female">
 <label for="female">Female</label> <br><br> 
 <!-- Course using dropdown --> 
 <label for="course">Course:</label>
 <select id="course" name="course"> 
<option value="">Select Course</option> 
<option value="html">HTML</option> 
 <option value="css">CSS</option> 
 <option value="javascript">JavaScript</option>
<option value="python">Python</option>
 </select> <br><br> 
<!-- Skills using checkboxes --> 
<label>Skills:</label>
<input type="checkbox" id="html" name="skills" value="HTML">
<label for="html">HTML</label> 
 <input type="checkbox" id="css" name="skills" value="CSS"> 
<label for="css">CSS</label>
 <input type="checkbox" id="js" name="skills" value="JavaScript"> 
 <label for="js">JavaScript</label> <br><br> 
<!-- Address using textarea --> 
<label for="address">Address:</label><br> 
<textarea id="address" name="address" rows="5" cols="40" placeholder="Enter your address"></textarea> <br><br>
 <!-- Submit button --> 
  <input type="submit" value="Submit"> <!-- Reset button -->
   <input type="reset" value="Reset"> 
 </form>
 </body> 
</html>
