
<!DOCTYPE html>
<html>
<head>
    <title>HTML Entities</title>
</head>
<body>

    <h1>HTML Code and Entities</h1>

    <!-- Display HTML code as text -->
    <p>
        HTML Code:
        &lt;h1&gt;Hello World&lt;/h1&gt;
    </p>

    <!-- Display special characters -->
    <p>Less than: &lt;</p>
    <p>Greater than: &gt;</p>
    <p>Ampersand: &amp;</p>
    <p>Copyright: &copy;</p>

</body>
</html>
